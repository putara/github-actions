name: Build nitter
on:
  workflow_dispatch:
  push:
    branches: ["main", "dev", "test"]
    paths:
      - '.github/workflows/nitter.yml'
      - '.github/workflows/build-docker.yml'
      - 'nitter/**'

jobs:
  build:
    uses: ./.github/workflows/build-docker.yml
    secrets: inherit
    with:
      name: nitter
      url: https://github.com/zedeus/nitter.git
