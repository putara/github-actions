name: Build yarr
on:
  workflow_dispatch:
  push:
    branches: ["main", "dev", "test"]
    paths:
      - '.github/workflows/yarr.yml'
      - '.github/workflows/build-docker.yml'
      - 'yarr/**'
  schedule:
    - cron: "4 4 * * 4"

jobs:
  build:
    uses: ./.github/workflows/build-docker.yml
    secrets: inherit
    with:
      name: yarr
      url: https://github.com/nkanaev/yarr.git
      dockerfile: etc/dockerfile
